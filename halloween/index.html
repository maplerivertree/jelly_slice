<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Jelly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<style>
  :root { --ink:#f3e4cf; --panel:rgba(24,15,32,.8); --line:rgba(255,160,80,.18); --accent:#ff7a1a; }
  html,body { margin:0; height:100%; background:#120b1c; color:var(--ink);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  canvas { display:block; touch-action:none; }
  body.knife canvas { cursor:crosshair; }
  .panel { position:fixed; left:16px; bottom:16px; right:16px; max-width:360px; box-sizing:border-box;
    background:var(--panel); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:16px; padding:14px;
    box-shadow:0 8px 30px rgba(0,0,0,.45), 0 0 36px rgba(255,122,26,.1); }
  .head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  h1 { margin:0; font:400 22px/1 Creepster,system-ui,sans-serif; letter-spacing:.04em; color:var(--accent); text-shadow:0 0 14px rgba(255,122,26,.5); }
  .hint { margin:0 0 12px; font-size:12px; opacity:.7; min-height:3em; }
  .seg { display:flex; background:rgba(255,255,255,.07); border-radius:10px; padding:2px; }
  .seg button { border:0; background:transparent; color:inherit; font:inherit; font-size:12px; padding:4px 12px; border-radius:8px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:#1e0f04; box-shadow:0 0 10px rgba(255,122,26,.45); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .chip { display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:rgba(255,255,255,.04);
    border-radius:999px; padding:5px 10px; cursor:pointer; font:inherit; font-size:12px; color:inherit; }
  .chip[aria-pressed="true"] { background:rgba(255,122,26,.16); border-color:var(--accent); }
  .dot { width:12px; height:12px; border-radius:50%; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); }
  .row { display:flex; align-items:center; gap:10px; }
  label { font-size:12px; white-space:nowrap; }
  input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
  .go { border:0; background:var(--accent); color:#1e0f04; border-radius:10px; padding:7px 12px; font:inherit; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .swap { display:inline-block; margin-top:10px; font-size:11px; color:inherit; opacity:.55; text-decoration:none; }
  .swap:hover { opacity:1; }
  #err { position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px; }
</style>
</head>
<body>
<div class="panel">
  <div class="head">
    <h1>Halloween Jelly</h1>
    <div class="seg" role="group" aria-label="Tool">
      <button data-tool="hand" aria-pressed="true">Hand</button>
      <button data-tool="knife" aria-pressed="false">Knife</button>
    </div>
  </div>
  <p class="hint" id="hint"></p>
  <div class="chips" id="chips"></div>
  <div class="row">
    <label for="firm">Firmness</label>
    <input id="firm" type="range" min="0" max="1" step="0.01" value="0.35">
    <button class="go" id="drop">New slice</button>
  </div>
  <a class="swap" href="../">🍊 Back to the citrus kitchen</a>
</div>
<div id="err">WebGL isn't available in this browser.</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
// Halloween edition of ../index.html: its own scene, kitchen and slice painters. The physics, cutting and pointer code
// is identical to the citrus page; material, knife and UI differ only in small tweaks (see docs/HOW-IT-WORKS.md §11)

// ---------- flavours (each brings its own painter, see "halloween slice textures") ----------
// glow = emissive strength of the painted glow layer; flicker = it breathes like a candle
const FLAVORS = {
  pumpkin: { name:"Jack-o'-lantern", dot:'#ff7a1a', atten:'#ff7a10', glow:1.7, flicker:true, paint:paintPumpkin },
  eyeball: { name:'Eyeball',     dot:'radial-gradient(circle,#111 0 22%,#4a9a3c 26% 48%,#f4ece2 52%)', atten:'#ffc9bd', glow:0.6, paint:paintEyeball },
  slime:   { name:'Toxic slime', dot:'#8cff2e', atten:'#30b400', glow:0.9, paint:paintSlime },
  web:     { name:'Spiderweb',   dot:'#9b4dff', atten:'#a060f0', glow:0.8, paint:paintWeb },
  corn:    { name:'Candy corn',  dot:'linear-gradient(#fff4dc 0 33%,#ff7412 33% 66%,#ffc81e 66%)', atten:'#ffb040', glow:0, paint:paintCandyCorn },
  ghost:   { name:'Ghost',       dot:'#dfe6ff', atten:'#c6d4ff', glow:0.7, paint:paintGhost },
};

// ---------- renderer / scene ----------
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias:true }); }
catch (e) { document.getElementById('err').style.display = 'grid'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#120b1c');
scene.fog = new THREE.Fog('#150d22', 12, 26);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(spookyRoom(), 0.04).texture;

// what the glossy jelly reflects: a dark room lit by a moonlit skylight, pumpkin and candle glows, and a witchy purple rim
function spookyRoom() {
  const room = new THREE.Scene();
  const box = new THREE.Mesh(new THREE.BoxGeometry(16, 8, 16), new THREE.MeshBasicMaterial({ color: '#17111f', side: THREE.BackSide }));
  box.position.y = 3; room.add(box);
  const glow = (hex, k, w, h, x, y, z) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); room.add(m);
  };
  glow('#aebfff', 5, 4, 2.5, -3, 6, 1);
  glow('#ff8a2a', 8, 1.6, 1.2, -5, 1, -3);
  glow('#ff9a3a', 6, 1.2, 1, 5, 1, -2);
  glow('#9a4dff', 2, 6, 1, 0, 2, -7.5);
  glow('#ffffff', 1.5, 3, 3, 2, 5, 6);
  glow('#8a7aa8', 0.8, 10, 4, -7.9, 3, 0);
  glow('#8a7aa8', 0.8, 10, 4, 7.9, 3, 0);
  return room;
}

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 3.6, 5.6);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.25, 0);
controls.enableDamping = true;
controls.minDistance = 2.5; controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.47;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };

scene.add(new THREE.HemisphereLight('#5a64a0', '#2a160c', 0.6));
const moon = new THREE.DirectionalLight('#c5d2ff', 1.6);
moon.position.set(-4, 8, 3);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left:-7, right:7, top:6, bottom:-6, near:1, far:25 });
moon.shadow.radius = 6;
moon.shadow.bias = -0.0005;
scene.add(moon);

// ---------- haunted kitchen: cutting board on a slate counter, stone wall, moonlit window, spooky props ----------
const BOARD_W = 6, BOARD_D = 4.2, BOARD_T = 0.14, COUNTER_Y = -BOARD_T, WALL_Z = -4.4;
function canvasTex(w, h, paint, { srgb = true, repeat = [1, 1] } = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); t.anisotropy = 8;
  return t;
}
let kseed = 3; const krnd = () => (kseed = (kseed * 16807) % 2147483647) / 2147483647;
const animators = []; // per-frame callbacks, t in seconds: flickering lights, bubbling brew, bobbing spider, flapping bats
const flicker = (t, s) => 0.84 + 0.08 * Math.sin(t * 9.1 + s) + 0.05 * Math.sin(t * 23.3 + s * 2.1) + 0.03 * Math.sin(t * 47.9 + s * 3.7);

const woodTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#8e5c36'; g.fillRect(0, 0, w, h);
  // butcher-block strips with their own tone, then wavy grain, then old knife scars
  for (let s = 0; s < 8; s++) { g.fillStyle = `hsla(${20 + krnd() * 8},${38 + krnd() * 15}%,${30 + krnd() * 10}%,0.55)`; g.fillRect(0, s * h / 8, w, h / 8); }
  for (let i = 0; i < 260; i++) {
    const y0 = krnd() * h, amp = 2 + krnd() * 6, f = 0.004 + krnd() * 0.01, ph = krnd() * 6;
    g.strokeStyle = `rgba(${50 + krnd() * 30},${25 + krnd() * 20},10,${0.08 + krnd() * 0.15})`;
    g.lineWidth = 0.6 + krnd() * 1.8; g.beginPath();
    for (let x = 0; x <= w; x += 8) g.lineTo(x, y0 + Math.sin(x * f + ph) * amp);
    g.stroke();
  }
  for (let i = 0; i < 90; i++) {
    const x = krnd() * w, y = krnd() * h, a = krnd() * Math.PI, l = 20 + krnd() * 70;
    g.strokeStyle = `rgba(255,214,170,${0.05 + krnd() * 0.08})`; g.lineWidth = 0.6 + krnd();
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  g.fillStyle = 'rgba(30,15,5,0.4)';
  for (let s = 1; s < 8; s++) g.fillRect(0, s * h / 8 - 1, w, 2);
});
const slateTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#26232c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { g.fillStyle = krnd() < 0.5 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.12)'; g.fillRect(krnd() * w, krnd() * h, 1 + krnd() * 2, 1 + krnd() * 2); }
  g.filter = 'blur(1.5px)';
  for (let v = 0; v < 12; v++) {
    let x = krnd() * w, y = krnd() * h, a = krnd() * Math.PI * 2;
    g.strokeStyle = `rgba(160,150,185,${0.06 + krnd() * 0.14})`; g.lineWidth = 0.6 + krnd() * 2.5;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 120; k++) { a += (krnd() - 0.5) * 0.5; x += Math.cos(a) * 9; y += Math.sin(a) * 9; g.lineTo(x, y); }
    g.stroke();
  }
  g.filter = 'none';
}, { repeat: [2, 2] });
const stoneTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#0e0b12'; g.fillRect(0, 0, w, h);
  // 6 × 12 running-bond blocks; tones are looked up per column so the texture tiles seamlessly
  const bw = w / 6, bh = h / 12, tone = Array.from({ length: 72 }, () => [15 + krnd() * 9, 250 + krnd() * 30]);
  for (let r = 0; r < 12; r++) for (let c = -1; c < 7; c++) {
    const x = c * bw + (r % 2 ? bw / 2 : 0), y = r * bh, [l, hue] = tone[r * 6 + (c + 6) % 6];
    const grad = g.createLinearGradient(x, y, x, y + bh);
    grad.addColorStop(0, `hsl(${hue},9%,${l + 4}%)`); grad.addColorStop(1, `hsl(${hue},9%,${l - 4}%)`);
    g.fillStyle = grad; g.beginPath(); g.roundRect(x + 4, y + 4, bw - 8, bh - 8, 12); g.fill();
    for (let k = 0; k < 10; k++) { g.fillStyle = `rgba(0,0,0,${0.15 + krnd() * 0.25})`; g.beginPath(); g.arc(x + 8 + krnd() * (bw - 16), y + 8 + krnd() * (bh - 16), 1 + krnd() * 3.5, 0, 7); g.fill(); }
  }
}, { repeat: [4, 2] });
const dimpleTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#888'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(${krnd() < 0.5 ? '0,0,0' : '255,255,255'},0.18)`; g.beginPath(); g.arc(krnd() * w, krnd() * h, 1 + krnd() * 2.5, 0, 7); g.fill(); }
}, { srgb: false, repeat: [3, 2] });
const glowSprite = canvasTex(128, 128, (g, w, h) => {
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.2, 'rgba(255,255,255,0.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});
const skyTex = canvasTex(512, 512, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#07071c'); sky.addColorStop(0.55, '#1a1440'); sky.addColorStop(0.8, '#43244f'); sky.addColorStop(1, '#6b3438');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 180; i++) { g.fillStyle = `rgba(255,250,235,${0.3 + krnd() * 0.7})`; g.beginPath(); g.arc(krnd() * w, krnd() * h * 0.7, 0.2 + krnd() * 1.3, 0, 7); g.fill(); }
  // full moon with a halo, a few craters and wisps of cloud
  const mx = w * 0.64, my = h * 0.48, mr = w * 0.13;
  const halo = g.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 3);
  halo.addColorStop(0, 'rgba(255,236,190,0.45)'); halo.addColorStop(1, 'rgba(255,236,190,0)');
  g.fillStyle = halo; g.fillRect(0, 0, w, h);
  g.fillStyle = '#f7eed2'; g.beginPath(); g.arc(mx, my, mr, 0, 7); g.fill();
  for (let i = 0; i < 9; i++) { const a = krnd() * 7, d = krnd() * mr * 0.7; g.fillStyle = `rgba(170,160,130,${0.2 + krnd() * 0.2})`; g.beginPath(); g.arc(mx + Math.cos(a) * d, my + Math.sin(a) * d, mr * (0.06 + krnd() * 0.14), 0, 7); g.fill(); }
  g.filter = 'blur(6px)'; g.fillStyle = 'rgba(30,20,50,0.55)';
  for (const [x, y, rx, ry] of [[0.5, 0.54, 0.22, 0.025], [0.75, 0.42, 0.18, 0.02], [0.3, 0.33, 0.2, 0.02]]) { g.beginPath(); g.ellipse(x * w, y * h, rx * w, ry * h, 0, 0, 7); g.fill(); }
  g.filter = 'none';
  // graveyard on a hill, a crooked tree and a few bats, all in silhouette
  g.fillStyle = g.strokeStyle = '#06050a';
  const hill = x => h * (0.8 - 0.06 * Math.sin(x / w * Math.PI * 1.3 + 0.3));
  g.beginPath(); g.moveTo(0, h);
  for (let x = 0; x <= w; x += 8) g.lineTo(x, hill(x));
  g.lineTo(w, h); g.fill();
  for (const [x, s] of [[0.1, 1], [0.21, 0.8], [0.42, 1.1], [0.53, 0.75], [0.7, 0.9]]) {
    const bx = x * w, by = hill(bx) + 6, tw = 20 * s, th = 34 * s;
    g.beginPath(); g.roundRect(bx - tw / 2, by - th, tw, th + 8, [tw / 2, tw / 2, 0, 0]); g.fill();
  }
  const kx = w * 0.31, ky = hill(kx) + 6;
  g.fillRect(kx - 3, ky - 46, 6, 50); g.fillRect(kx - 14, ky - 36, 28, 6);
  const branch = (x, y, a, len, wd) => {
    if (wd < 0.8) return;
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    g.lineWidth = wd; g.lineCap = 'round'; g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
    branch(x2, y2, a - 0.35 - krnd() * 0.3, len * 0.72, wd * 0.65);
    branch(x2, y2, a + 0.3 + krnd() * 0.35, len * 0.68, wd * 0.65);
  };
  branch(w * 0.9, hill(w * 0.9) + 4, -Math.PI / 2 - 0.08, h * 0.13, 9);
  for (const [x, y, s] of [[0.5, 0.3, 1], [0.58, 0.24, 0.7], [0.8, 0.3, 0.8]]) {
    const bx = x * w, by = y * h;
    g.beginPath(); g.moveTo(bx, by + 3 * s);
    g.quadraticCurveTo(bx - 6 * s, by - 6 * s, bx - 14 * s, by - 2 * s); g.quadraticCurveTo(bx - 9 * s, by, bx - 7 * s, by + 4 * s);
    g.quadraticCurveTo(bx - 3 * s, by + 1 * s, bx, by + 6 * s); g.quadraticCurveTo(bx + 3 * s, by + 1 * s, bx + 7 * s, by + 4 * s);
    g.quadraticCurveTo(bx + 9 * s, by, bx + 14 * s, by - 2 * s); g.quadraticCurveTo(bx + 6 * s, by - 6 * s, bx, by + 3 * s); g.fill();
  }
});

// carved jack-o'-lantern face as one path, in units of s around (x, y); used for the jelly and the props
function facePath(ctx, x, y, s, angry = false) {
  const poly = pts => { pts.forEach(([u, v], i) => i ? ctx.lineTo(x + u * s, y + v * s) : ctx.moveTo(x + u * s, y + v * s)); ctx.closePath(); };
  ctx.beginPath();
  for (const k of [-1, 1]) poly(angry ? [[k * 0.1, -0.12], [k * 0.56, -0.12], [k * 0.5, -0.42]] : [[k * 0.12, -0.14], [k * 0.56, -0.14], [k * 0.34, -0.48]]);
  poly([[0, -0.04], [0.1, 0.1], [-0.1, 0.1]]);
  const top = [], bot = [];
  for (let i = 0; i <= 24; i++) {
    const u = -0.62 + 1.24 * i / 24, w = 1 - (u / 0.62) ** 2;
    let a = 0.14 + 0.16 * w, b = 0.14 + 0.42 * w;
    if (angry) { if (i % 4 === 2) a += 0.1; if (i % 4 === 0 && i % 24) b -= 0.1; }
    else { if (Math.abs(Math.abs(u) - 0.24) < 0.07) a += 0.1; if (Math.abs(u) < 0.07) b -= 0.11; }
    top.push([u, a]); bot.unshift([u, b]);
  }
  poly([...top, ...bot]);
}

function buildKitchen() {
  const k = new THREE.Group();
  const shadowy = o => { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

  // slate counter + old stone wall
  const counter = new THREE.Mesh(new THREE.BoxGeometry(22, 0.6, 9), new THREE.MeshPhysicalMaterial({ map: slateTex, roughness: 0.3, clearcoat: 0.6, clearcoatRoughness: 0.2 }));
  counter.position.set(0, COUNTER_Y - 0.3, WALL_Z + 4.5); counter.receiveShadow = true;
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(22, 8), new THREE.MeshStandardMaterial({ map: stoneTex, bumpMap: stoneTex, bumpScale: 1.5, roughness: 0.85 }));
  wall.position.set(0, COUNTER_Y + 4, WALL_Z); wall.receiveShadow = true;
  k.add(counter, wall);

  // cutting board (top face sits at y = 0, the physics floor)
  const s = new THREE.Shape(), bw = BOARD_W / 2, bd = BOARD_D / 2, br = 0.25;
  s.moveTo(-bw + br, -bd); s.lineTo(bw - br, -bd); s.quadraticCurveTo(bw, -bd, bw, -bd + br);
  s.lineTo(bw, bd - br); s.quadraticCurveTo(bw, bd, bw - br, bd); s.lineTo(-bw + br, bd);
  s.quadraticCurveTo(-bw, bd, -bw, bd - br); s.lineTo(-bw, -bd + br); s.quadraticCurveTo(-bw, -bd, -bw + br, -bd);
  const handleHole = new THREE.Path(); handleHole.absellipse(bw - 0.45, 0, 0.12, 0.45, 0, Math.PI * 2); s.holes.push(handleHole);
  const bgeo = new THREE.ExtrudeGeometry(s, { depth: BOARD_T - 0.04, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.03, bevelSegments: 3, curveSegments: 16 });
  bgeo.rotateX(-Math.PI / 2); bgeo.translate(0, COUNTER_Y + 0.02, 0);
  woodTex.repeat.set(1 / BOARD_W, 1 / BOARD_D); woodTex.offset.set(0.5, 0.5);
  const board = new THREE.Mesh(bgeo, new THREE.MeshPhysicalMaterial({ map: woodTex, roughness: 0.55, clearcoat: 0.15 }));
  board.position.z = 0.1;
  k.add(shadowy(board));

  // moonlit window with a graveyard view (and a cobweb in the corner)
  const win = new THREE.Group(), ww = 2.6, wh = 2.2, ft = 0.12;
  win.add(new THREE.Mesh(new THREE.PlaneGeometry(ww, wh), new THREE.MeshBasicMaterial({ map: skyTex, fog: false })));
  const frameMat = new THREE.MeshStandardMaterial({ color: '#2b1c14', roughness: 0.7 });
  for (const [w, h, d, x, y] of [[ww + 2 * ft, ft, 0.16, 0, wh / 2 + ft / 2], [ww + 2 * ft + 0.2, ft, 0.34, 0, -wh / 2 - ft / 2],
    [ft, wh, 0.16, -ww / 2 - ft / 2, 0], [ft, wh, 0.16, ww / 2 + ft / 2, 0], [0.05, wh, 0.06, 0, 0], [ww, 0.05, 0.06, 0, wh * 0.12]]) {
    const bar = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), frameMat); bar.position.set(x, y, d / 2); win.add(bar);
  }

const TS = 1024, TC = TS / 2, TR = TS * 0.49;

// ---------- the jelly material (shared by every piece) ----------
const mat = new THREE.MeshPhysicalMaterial({
  roughness: 0.1, transmission: 1, thickness: 0.55, ior: 1.42,
  clearcoat: 1, clearcoatRoughness: 0.06, bumpScale: 0.6,
  attenuationDistance: 0.7, specularIntensity: 1,
  emissive: '#ffffff', emissiveIntensity: 0, // each flavour's glow layer arrives as emissiveMap

// ---------- one soft-body piece: overlapping-cluster shape matching (PBD) ----------

    this.n = this.x.length / 3;
    this.rest = Float32Array.from(this.x);
    this.p = new Float32Array(this.x.length);
    this.v = new Float32Array(this.x.length);

      rad = Math.max(rad, Math.hypot(this.q0[i * 3], this.q0[i * 3 + 1], this.q0[i * 3 + 2]));
    }
    this.rad = rad + 0.05;
    this.fitQ = [0, 0, 0, 1]; this.Rfit = new Float64Array([1, 0, 0, 0, 1, 0, 0, 0, 1]); this.c = this.rc0.slice();

  buildClusters() {

// ---------- world ----------
let pieces = [];
function newSlice() {
  pieces.forEach(p => p.dispose());
  pieces = [new Piece(circleOutline)];
  scene.add(pieces[0].mesh);
  const r = (a, b) => a + Math.random() * (b - a);
  // only a little yaw, so painted faces land roughly upright
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(r(-0.7, 0.7), r(-0.35, 0.35), r(-0.7, 0.7)));
  pieces[0].place(q, new THREE.Vector3(r(-0.3, 0.3), 2.4, r(-0.3, 0.3)));
}

// pieces push each other out using the other piece's exact rounded-slab distance, in its rest frame
const cp = [0, 0];
function collidePieces() {
  for (const a of pieces) for (const b of pieces) {
    if (a === b) continue;
    const R = b.Rfit, c = b.c, r0 = b.rc0, poly = b.inset, P = a.p, rb2 = b.rad * b.rad;
    if (Math.hypot(a.c[0] - c[0], a.c[1] - c[1], a.c[2] - c[2]) > a.rad + b.rad) continue;
    for (let i = 0; i < a.n * 3; i += 3) {
      const px = P[i] - c[0], py = P[i + 1] - c[1], pz = P[i + 2] - c[2];
      if (px * px + py * py + pz * pz > rb2) continue;
      const rx = R[0] * px + R[3] * py + R[6] * pz + r0[0];
      const ry = R[1] * px + R[4] * py + R[7] * pz + r0[1];
      const rz = R[2] * px + R[5] * py + R[8] * pz + r0[2];
      closestOnPoly(poly, rx, rz, cp);
      let gx = rx - cp[0], gy = ry, gz = rz - cp[1];
      const dist = Math.hypot(gx, gy, gz);
      if (dist >= C) continue;
      if (dist < 1e-5) { gx = 0; gy = 1; gz = 0; } else { gx /= dist; gy /= dist; gz /= dist; }
      const push = (C - dist) * 0.5;
      P[i]     += (R[0] * gx + R[1] * gy + R[2] * gz) * push;
      P[i + 1] += (R[3] * gx + R[4] * gy + R[5] * gz) * push;
      P[i + 2] += (R[6] * gx + R[7] * gy + R[8] * gz) * push;
    }

}

// the blade as a collider: before breakthrough it presses a groove, after it wedges the halves apart
const BLADE_X0 = -1.45, BLADE_X1 = 1.0, SPINE = 0.34;
function applyBlade(piece, bl) {
  const P = piece.p;
  for (let i = 0; i < piece.n * 3; i += 3) {
    const rx = P[i] - bl.mx, rz = P[i + 2] - bl.mz, along = rx * bl.dx + rz * bl.dz;
    if (along < BLADE_X0 || along > BLADE_X1) continue;
    const y = P[i + 1], up = y - bl.edgeY;
    if (up < 0 || up > SPINE) continue;
    const side = rx * bl.nx + rz * bl.nz;
    if (bl.pressing) {
      const w = 0.07;
      if (Math.abs(side) < w) P[i + 1] = bl.edgeY;
    } else {
      const half = 0.012 + 0.09 * Math.min(1, up / 0.34);
      if (Math.abs(side) < half) {
        const s = (side >= 0 ? half : -half) - side;
        P[i] += bl.nx * s; P[i + 2] += bl.nz * s;
      }
    }
  }
}

function worldStep(h, alpha, beta, grab, blade) {
  for (const pc of pieces) { pc.predict(h); pc.solve(alpha, beta); }
  if (grab && pieces.includes(grab.piece)) {
    const { ids, ws, off, target, piece } = grab, p = piece.p;
    for (let j = 0; j < ids.length; j++) {
      const i = ids[j] * 3, w = ws[j] * 0.3;
      p[i]     += (target.x + off[j * 3] - p[i]) * w;
      p[i + 1] += (target.y + off[j * 3 + 1] - p[i + 1]) * w;
      p[i + 2] += (target.z + off[j * 3 + 2] - p[i + 2]) * w;
    }
  }
  if (blade) for (const pc of pieces) applyBlade(pc, blade);
  if (pieces.length > 1) collidePieces();
  for (const pc of pieces) pc.finalize(h);
}

// ---------- cutting ----------
const CELL = 0.1;

  const grid = new Map();

    const key = Math.floor(pc.rest[j * 3] / CELL) * 1000 + Math.floor(pc.rest[j * 3 + 2] / CELL);
    let l = grid.get(key); if (!l) grid.set(key, l = []); l.push(j * 3);

      pc.x[i * 3 + 1] = old.x[best + 1] + R[3] * ox + R[4] * oy + R[5] * oz;
      pc.x[i * 3 + 2] = old.x[best + 2] + R[6] * ox + R[7] * oy + R[8] * oz;
      pc.v[i * 3]     = old.v[best] + sgn * bl.nx * 0.7;
      pc.v[i * 3 + 1] = old.v[best + 1];

  const next = [];

    if (halves) { pc.dispose(); for (const h of halves) { scene.add(h.mesh); next.push(h); } }
    else next.push(pc);

// ---------- the knife ----------
function buildKnife() {
  const g = new THREE.Group();
  const s = new THREE.Shape();
  s.moveTo(1.0, 0); s.lineTo(-0.85, 0);
  s.quadraticCurveTo(-1.32, 0.03, -1.45, 0.27);
  s.quadraticCurveTo(-1.3, 0.34, -1.05, 0.34);
  s.lineTo(1.0, 0.34); s.lineTo(1.0, 0);
  const bladeGeo = new THREE.ExtrudeGeometry(s, { depth: 0.014, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2, curveSegments: 24 });
  bladeGeo.translate(0, 0, -0.007);
  const steel = new THREE.MeshPhysicalMaterial({ color: '#dfe3e8', metalness: 1, roughness: 0.2, clearcoat: 0.4, clearcoatRoughness: 0.2, envMapIntensity: 3 }); // brighter reflections: the haunted room is dark
  const bone = new THREE.MeshStandardMaterial({ color: '#e2d6bc', roughness: 0.5 });
  const blade = new THREE.Mesh(bladeGeo, steel);
  const bolster = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.36, 0.06), steel);
  bolster.position.set(1.035, 0.18, 0);
  const handle = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.95, 6, 20), bone);
  handle.rotation.z = Math.PI / 2; handle.scale.set(1.3, 1, 0.8); handle.position.set(1.6, 0.19, 0);
  g.add(blade, bolster, handle);
  for (const x of [1.35, 1.65, 1.95]) {
    const rivet = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.13, 12), steel);
    rivet.rotation.x = Math.PI / 2; rivet.position.set(x, 0.19, 0);
    g.add(rivet);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  return g;
}
const knife = buildKnife();
knife.visible = false;
scene.add(knife);
const knifeAngle = d => Math.atan2(-d.z, d.x);
const HOVER_Y = 0.75;
let knifeDir = new THREE.Vector3(1, 0, -0.45).normalize();
let cut = null; // active cut animation

const strokeGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
const strokeLine = new THREE.Line(strokeGeo, new THREE.LineDashedMaterial({ color: '#ffc890', dashSize: 0.08, gapSize: 0.06, transparent: true, opacity: 0.6 }));
strokeLine.visible = false;
scene.add(strokeLine);

function startCut(mid, dir) {
  knifeDir.copy(dir);
  cut = { t: 0, mid: mid.clone(), dir: dir.clone(), from: knife.position.clone(), fromAng: knife.rotation.y, ang: knifeAngle(dir), split: false };
}
const ease = t => t * t * (3 - 2 * t);
function updateCut(dt) {
  if (!cut) return null;
  cut.t += dt;
  const t = cut.t, top = HOVER_Y;
  let edgeY;
  if (t < 0.2) {
    const k = ease(t / 0.2);
    knife.position.lerpVectors(cut.from, new THREE.Vector3(cut.mid.x, top, cut.mid.z), k);
    let da = cut.ang - cut.fromAng; da = Math.atan2(Math.sin(da), Math.cos(da));
    knife.rotation.y = cut.fromAng + da * k;
    edgeY = knife.position.y;
  } else {
    knife.position.set(cut.mid.x, 0, cut.mid.z);
    knife.rotation.y = cut.ang;
    if (t < 0.8) edgeY = top + (-0.005 - top) * ease((t - 0.2) / 0.6);
    else if (t < 0.95) edgeY = -0.005;
    else edgeY = -0.005 + (top + 0.005) * ease(Math.min(1, (t - 0.95) / 0.3));
    knife.position.y = edgeY;
  }
  const n = new THREE.Vector3(-cut.dir.z, 0, cut.dir.x);
  const blade = { mx: cut.mid.x, mz: cut.mid.z, dx: cut.dir.x, dz: cut.dir.z, nx: n.x, nz: n.z, edgeY, pressing: !cut.split };
  if (!cut.split && t >= 0.2 && edgeY <= C * 1.1) { performCut(blade); cut.split = true; blade.pressing = false; }
  if (t > 1.25) { cut = null; return null; }
  return t >= 0.2 && edgeY < top - 0.05 ? blade : null;
}

// ---------- UI ----------
let tool = 'hand';
const hint = document.getElementById('hint');
const HINTS = {
  hand: 'Drag the jelly to squish & toss · drag empty space to orbit · double-click to poke · K for knife',
  knife: 'Drag a line across the jelly to cut along it · click to chop · Q/E turn the blade · right-drag to orbit · H for hand',
};
function setTool(t) {
  tool = t;
  document.body.classList.toggle('knife', t === 'knife');
  document.querySelectorAll('[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t));
  hint.textContent = HINTS[t];
  knife.visible = t === 'knife';
  if (t === 'knife' && !cut) { knife.position.set(0, HOVER_Y, 0.6); knife.rotation.y = knifeAngle(knifeDir); }
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));

let flavorKey = 'pumpkin';
function setFlavor(key) {
  flavorKey = key;
  const f = FLAVORS[key], t = paintSlice(f);
  for (const k of ['map', 'transmissionMap', 'bumpMap', 'emissiveMap']) { mat[k]?.dispose(); mat[k] = t[k]; }
  mat.attenuationColor.set(f.atten);
  mat.emissiveIntensity = f.glow;
  mat.needsUpdate = true;
  document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.key === key));
}
animators.push(t => { const f = FLAVORS[flavorKey]; if (f.flicker) mat.emissiveIntensity = f.glow * flicker(t, 4.2); });
const chips = document.getElementById('chips');
for (const [key, f] of Object.entries(FLAVORS)) {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.key = key;
  b.innerHTML = `<span class="dot" style="background:${f.dot}"></span>${f.name}`;
  b.onclick = () => { setFlavor(key); newSlice(); };
  chips.append(b);
}
const firm = document.getElementById('firm');
document.getElementById('drop').onclick = newSlice;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'r') newSlice();
  else if (k === 'k') setTool('knife');
  else if (k === 'h') setTool('hand');
  else if ((k === 'q' || k === 'e') && tool === 'knife' && !cut) {
    knifeDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), k === 'q' ? 0.2 : -0.2);
    knife.rotation.y = knifeAngle(knifeDir);
  }
});

// ---------- pointer ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tmp = new THREE.Vector3();
const cutPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -C);
let grab = null, stroke = null, dragPlane = new THREE.Plane();
function aim(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function hitJelly() {
  for (const pc of pieces) pc.geo.computeBoundingSphere();
  return ray.intersectObjects(pieces.map(p => p.mesh))[0];
}
function groundPoint() { return ray.ray.intersectPlane(cutPlane, new THREE.Vector3()); }
function patch(piece, point, radius) {
  const ids = [], ws = [], off = [], X = piece.x;
  for (let i = 0; i < piece.n; i++) {
    const dx = X[i * 3] - point.x, dy = X[i * 3 + 1] - point.y, dz = X[i * 3 + 2] - point.z;
    const d = Math.hypot(dx, dy, dz);
    if (d < radius) { ids.push(i); ws.push((1 - d / radius) ** 2); off.push(dx, dy, dz); }
  }
  return { ids, ws, off };
}
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  aim(e);
  if (tool === 'hand') {
    const hit = hitJelly();
    if (!hit) return;
    controls.enabled = false;
    canvas.setPointerCapture(e.pointerId);
    dragPlane.setFromNormalAndCoplanarPoint(camera.getWorldDirection(tmp).negate(), hit.point);
    const piece = hit.object.userData.piece;
    grab = { piece, ...patch(piece, hit.point, 0.45), target: hit.point.clone() };
  } else {
    if (cut) return;
    const g = groundPoint();
    if (!g) return;
    controls.enabled = false;
    canvas.setPointerCapture(e.pointerId);
    stroke = { a: g, b: g.clone() };
  }
}, { capture: true });
canvas.addEventListener('pointermove', e => {
  aim(e);
  if (grab) {
    if (ray.ray.intersectPlane(dragPlane, tmp)) { grab.target.copy(tmp); grab.target.y = Math.max(grab.target.y, 0.05); }
    return;
  }
  if (tool !== 'knife' || cut) return;
  const g = groundPoint();
  if (!g) return;
  if (stroke) {
    stroke.b.copy(g);
    const d = tmp.subVectors(stroke.b, stroke.a).setY(0);
    if (d.length() > 0.1) knifeDir.copy(d.normalize());
    const pts = strokeGeo.attributes.position;
    pts.setXYZ(0, stroke.a.x, 0.02, stroke.a.z); pts.setXYZ(1, stroke.b.x, 0.02, stroke.b.z); pts.needsUpdate = true;
    strokeLine.computeLineDistances();
    strokeLine.visible = true;
    knife.position.set((stroke.a.x + stroke.b.x) / 2, HOVER_Y, (stroke.a.z + stroke.b.z) / 2);
  } else {
    knife.position.set(g.x, HOVER_Y, g.z);
  }
  knife.rotation.y = knifeAngle(knifeDir);
});
function release() {
  if (stroke) {
    const len = Math.hypot(stroke.b.x - stroke.a.x, stroke.b.z - stroke.a.z);
    const mid = len > 0.15 ? stroke.a.clone().add(stroke.b).multiplyScalar(0.5) : stroke.b.clone();
    mid.y = 0;
    startCut(mid, knifeDir.clone());
    strokeLine.visible = false;
    stroke = null;
  }
  grab = null;
  controls.enabled = true;
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('dblclick', e => {
  if (tool !== 'hand') return;
  aim(e);
  const hit = hitJelly();
  if (!hit) return;
  const piece = hit.object.userData.piece, { ids, ws } = patch(piece, hit.point, 0.4), nrm = hit.face.normal;
  for (let j = 0; j < ids.length; j++) {
    const i = ids[j] * 3, k = 7 * ws[j];
    piece.v[i] -= nrm.x * k; piece.v[i + 1] -= nrm.y * k; piece.v[i + 2] -= nrm.z * k;
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- loop ----------
setFlavor(flavorKey);
setTool('hand');
newSlice();
window.halloweenJelly = { get pieces() { return pieces; }, newSlice, setFlavor, setTool, startCut, worldStep, updateCut }; // handy for console tinkering

const DT = 1 / 60, SUB = 6;
let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
  const f = +firm.value, alpha = 0.05 + 0.45 * f * f, beta = 0.45 - 0.25 * f;
  let steps = 0;
  while (acc >= DT && steps < 3) {
    const blade = updateCut(DT);
    for (let s = 0; s < SUB; s++) worldStep(DT / SUB, alpha, beta, grab, blade);
    acc -= DT; steps++;
  }
  if (steps === 3) acc = 0;
  for (const pc of pieces) { pc.geo.attributes.position.needsUpdate = true; pc.geo.computeVertexNormals(); }
  for (const a of animators) a(now / 1000);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
